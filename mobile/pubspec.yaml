name: arzana_mobile
description: "Aplikasi Mobile Kasir & Admin - Warkop Ruma"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests
  http: ^1.2.0

  # Local storage untuk token auth
  shared_preferences: ^2.2.2

  # State management
  provider: ^6.1.2

  # Format angka / tanggal
  intl: ^0.19.0

  # Upload gambar menu / pengaturan
  image_picker: ^1.0.7

  # Icons
  cupertino_icons: ^1.0.6
  qr_flutter: ^4.1.0

  # QR code scanner (untuk scanning QR meja, jika diperlukan di masa depan)
  # qr_code_scanner: ^1.0.1

  # Notifikasi (polling background)
  # flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpeg
    - assets/icons/

    
